<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>numi-kde GUI Prototype</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div>
          <h1>numi-kde</h1>
          <p id="status">Ready</p>
        </div>
        <button id="copy-results" type="button">Copy Results</button>
      </header>

      <section class="workspace" aria-label="Document calculator">
        <textarea id="source" spellcheck="false" autofocus>x = 10
y = x * 2
20 inches in cm
2026-04-30 + 2 weeks
2 smoots in m</textarea>
        <aside id="results" aria-label="Results"></aside>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
