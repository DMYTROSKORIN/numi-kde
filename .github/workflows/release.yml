name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --disablerepo=fedora-cisco-openh264 \
            git cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kwindowsystem-devel kf6-kglobalaccel-devel \
            kf6-kconfig-devel kf6-kdbusaddons-devel kf6-knotifications-devel \
            libqalculate-devel \
            rpm-build dbus-daemon glibc-langpack-en

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S kde -B build/release -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/release --target numi-kde numi-kde-tests

      - name: Test
        run: dbus-run-session -- ctest --test-dir build/release --output-on-failure --timeout 300

      - name: Package
        run: cmake --build build/release --target package

      # Signing: the private key lives only in the repository secrets; the
      # public half is committed as packaging/RPM-GPG-KEY-numi-kde and shipped
      # inside the package so the update helper can verify the next release.
      - name: Sign RPM
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_KEY_ID: ${{ secrets.RPM_SIGNING_KEY_ID }}
        run: |
          dnf install -y rpm-sign gnupg2
          [ -n "$RPM_SIGNING_KEY" ] || { echo "RPM_SIGNING_KEY secret is missing"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$RPM_SIGNING_KEY" | gpg --batch --import
          printf '%%_gpg_name %s\n%%_gpg_digest_algo sha256\n' "$RPM_SIGNING_KEY_ID" > ~/.rpmmacros
          rpmsign --addsign build/release/*.rpm
          rm -rf "$GNUPGHOME"

      - name: Verify signature against the committed public key
        run: |
          rpmkeys --import packaging/RPM-GPG-KEY-numi-kde
          rpmkeys --checksig build/release/*.rpm | tee /tmp/checksig
          grep -q 'signatures OK' /tmp/checksig || { echo "RPM is not signed"; exit 1; }
          sig=$(rpm -qp --qf '%{RSAHEADER:pgpsig}' build/release/*.rpm)
          echo "signature: $sig"
          key_id=$(gpg --batch --show-keys --with-colons packaging/RPM-GPG-KEY-numi-kde | awk -F: '$1=="fpr"{print tolower(substr($10,25)); exit}')
          echo "$sig" | grep -qi "Key ID $key_id" || { echo "RPM signed with an unexpected key (want $key_id)"; exit 1; }

      - name: Inspect RPM
        run: |
          rpm -qpi build/release/*.rpm
          rpm -qpl build/release/*.rpm
          rpm -qpR build/release/*.rpm

      - name: Verify RPM contents
        run: bash scripts/check-rpm-contents.sh build/release/*.rpm

      - name: rpmlint (informational)
        run: |
          dnf install -y rpmlint
          rpmlint build/release/*.rpm || true

      - name: Install and probe RPM
        run: |
          dnf install -y ./build/release/*.rpm
          numi-kde --version
          numi-kde --probe
          dnf remove -y numi-kde

      - name: Upload RPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm
          path: build/release/*.rpm

  release:
    name: Publish Release
    needs: [rpm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm
          path: dist/

      - name: Copy installer scripts and public key
        run: cp packaging/install.sh packaging/uninstall.sh packaging/RPM-GPG-KEY-numi-kde dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
